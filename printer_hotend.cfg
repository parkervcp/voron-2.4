[tmc2209 extruder]
uart_pin: hotend:gpio20
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[fan] # fan 1
pin: hotend:gpio14
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan] # fan 2
pin: hotend:gpio4
heater: extruder
heater_temp: 50.0
max_power: 1.0
kick_start_time: 0.5

[heater_fan fan3]
pin: hotend:gpio5

[fan_generic 4W_FAN0]
pin: hotend:gpio16
tachometer_pin: hotend:gpio12
#tachometer_ppr: 1

[neopixel hotend_rgb]
pin: hotend:gpio15
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 1.0

[filament_switch_sensor toolhead_sensor]
switch_pin: ^hotend:gpio6

[filament_switch_sensor pre_extruder]
switch_pin: hotend:gpio13